# Karsa Studio - Nginx Security Configuration
# Apply these rules to your Nginx virtual host (/etc/nginx/sites-available/...)
# to protect against DDoS, defacement, and common vulnerabilities.

# 1. Rate Limiting (DDoS Protection)
# Add this line OUTSIDE your server block (usually in http {} block in /etc/nginx/nginx.conf):
# limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# Add these lines INSIDE your server {} block in the site config:

# Apply rate limiting to prevent simple HTTP flood DDoS
limit_req zone=mylimit burst=50 nodelay;

# 2. Security Headers (Prevents XSS, Clickjacking, MIME-sniffing)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Note: Strict CSP is already embedded directly in the HTML files.

# 3. Block Hidden Files & Directories (Prevents exposing .git, .env, dll.)
location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
}

# 4. Block Common Exploits and Bad Bots
if ($http_user_agent ~* (nmap|nikto|wikto|sf|sqlmap|bsqlbf|w3af|acunetix|havij|appscan)) {
    return 403;
}

# Block suspicious request methods (Only allow GET, POST, HEAD)
if ($request_method !~ ^(GET|HEAD|POST)$) {
    return 444;
}

# 5. Disable Server Signature (Hide Nginx version)
# Ensure this is set in your nginx.conf:
# server_tokens off;
